name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**/*.py"
      - "requirements*.txt"
      - "WordReviewTool.spec"
      - ".github/workflows/build-windows-exe.yml"

jobs:
  build:
    runs-on: windows-latest
    env:
      # 強制 Python 使用 UTF-8，避免 Windows runner 的 cp1252 無法輸出中文。
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Verify source and reports
        run: |
          python -X utf8 -m compileall -q main.py gui.py generate_mock.py word_review
          python -X utf8 generate_mock.py --output-dir test-data
          python -X utf8 main.py extract test-data/contract_tracked.docx --output test-output/tracked.html
          python -X utf8 main.py compare test-data/contract_before.docx test-data/contract_after.docx --output test-output/compare.html

      - name: Build executable
        run: pyinstaller --noconfirm --clean WordReviewTool.spec

      - name: Smoke test executable exists
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/WordReviewTool.exe")) {
            throw "WordReviewTool.exe was not generated"
          }

      - name: Upload Windows executable
        id: upload-exe
        uses: actions/upload-artifact@v5
        with:
          name: WordReviewTool-Windows-x64
          path: dist/WordReviewTool.exe
          if-no-files-found: error
          retention-days: 30

      - name: Add download link to summary
        shell: pwsh
        run: |
          "## Windows EXE" >> $env:GITHUB_STEP_SUMMARY
          "[Download WordReviewTool-Windows-x64](${{ steps.upload-exe.outputs.artifact-url }})" >> $env:GITHUB_STEP_SUMMARY
